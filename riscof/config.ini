# RISCOF configuration
# DUT = our processor (homemade_rv32i), Reference = Spike
# Both plugins use the DUT's ISA/platform YAMLs so they run with the same config
# All paths are relative to this file's directory (riscof/)

[RISCOF]
ReferencePlugin=spike
ReferencePluginPath=spike
DUTPlugin=homemade_rv32i
DUTPluginPath=homemade_rv32i

[homemade_rv32i]
pluginpath=homemade_rv32i
ispec=homemade_rv32i/homemade_rv32i_isa.yaml
pspec=homemade_rv32i/homemade_rv32i_platform.yaml
target_run=1

[spike]
pluginpath=spike
ispec=homemade_rv32i/homemade_rv32i_isa.yaml
pspec=homemade_rv32i/homemade_rv32i_platform.yaml
target_run=1
